server.port=8083
spring.application.name=ms-monitor

# ── Kafka ──────────────────────────────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}

# Consumer ubicaciones
spring.kafka.consumer.group-id=monitor-ubicaciones-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# ── H2 Database ────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:monitordb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# ── H2 Console (http://localhost:8083/h2-console) ──────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ── Jackson ────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false